<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIP - Simple Image Processor</title>
  <link rel="icon" href="./img/gnp.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,200,0,0&icon_names=draw,drag_pan,arrow_range,ink_eraser,add,arrow_selector_tool" />
</head>
<body>
  <noscript>You need to enable JavaScript to use this website</noscript>
  <div id="modes">
    <button title="Add image" class="mode add-image-button" id="add-mode">
      <span class="material-symbols-outlined">add</span>
    </button>
    <button title="Normal mode" onclick="changeMode('normal')" class="mode" id="normal-mode">
      <span class="material-symbols-outlined">arrow_selector_tool</span>
    </button>
    <button title="Drag mode" onclick="changeMode('drag')" class="mode" id="drag-mode">
      <span class="material-symbols-outlined">drag_pan</span>
    </button>
    <button title="Draw mode" onclick="changeMode('draw')" class="mode" id="draw-mode">
      <span class="material-symbols-outlined">draw</span>
    </button>
    <button title="Erase mode" onclick="changeMode('erase')" class="mode" id="erase-mode">
      <span class="material-symbols-outlined">ink_eraser</span>
    </button>
    <button title="Flip mode" onclick="changeMode('flip')" class="mode" id="flip-mode">
      <span class="material-symbols-outlined">arrow_range</span>
    </button>
  </div>
  <div class="canvas-wrapper">
    <canvas id="canvas"></canvas>
    <input type="file" id="image-input" accept="image/*">
    <button id="add-image" class="add-image-button">Click, drag, or paste to add an image</button>
  </div>
  <div id="sidebar">
    <h3>Layers</h3>
    <div id="layers">
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
