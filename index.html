<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>SIP</title>
</head>
<body>
  <nav>
    <ul>
      <li class="nav-menu-item">
        <button>File</button>
        <div class='nav-submenu'>
          <ul>
            <li>
              <button>New</button>
              <p class='submenu-shortcut'>Ctrl+N</p>
            </li>
            <li id="open-file-button">
              <button>Open</button>
              <p class='submenu-shortcut'>Ctrl+O</p>
            </li>
            <div class='section-divider'></div>
            <li>
              <button>Save</button>
              <p class='submenu-shortcut'>Ctrl+S</p>
            </li>
            <li>
              <button>Save as</button>
            </li>
          </ul>
        </div>
      </li>
      <li class="nav-menu-item">
        <button>Edit</button>
        <div class='nav-submenu'>
          <ul>
            <li>
              <button>Undo</button>
              <p class='submenu-shortcut'>Ctrl+Z</p>
            </li>
            <li>
              <button>Redo</button>
              <p class='submenu-shortcut'>Ctrl+Y</p>
            </li>
            <div class="section-divider"></div>
            <li>
              <button>Cut</button>
              <p class='submenu-shortcut'>Ctrl+X</p>
            </li>
            <li>
              <button>Copy</button>
              <p class='submenu-shortcut'>Ctrl+C</p>
            </li>
            <li>
              <button>Paste</button>
              <p class='submenu-shortcut'>Ctrl+V</p>
            </li>
          </ul>
        </div>
      </li>
      <li class="nav-menu-item">
        <button>Image</button>
      </li>
      <li class="nav-menu-item">
        <button>View</button>
      </li>
      <li class="nav-menu-item">
        <button>Tools</button>
      </li>
    </ul>
  </nav>
  <main>
    <div class='sidebar' id="left-sidebar">
      <div class="resize-handler"></div>
      <div class="tools-container"></div>

    </div>
    <canvas draggable="false" id="sip-canvas"></canvas>
    <div class='sidebar' id="right-sidebar">
      <div class="resize-handler"></div>
      <div id="color-tab">
        <h4 class="tab-title">Color</h4>
        <canvas draggable="false" id="color-wheel-canvas"></canvas>
        <div id="selected-color-preview"></div>
      </div>

      <div id="layer-tab">
        <h4 class="tab-title">Layers</h4>
        <p id="layer-opacity-value">Opacity: 1</p>
        <div id="layer-buttons-container">
          <input disabled type="range" name="layer-opacity" id="layer-opacity-input" min="0" max="100" value="100">
          <button id="move-layer-up">
            <img src="/img/icons/arrow.png">
          </button>
          <button id="move-layer-down">
            <img src="/img/icons/arrow.png">
          </button>
        </div>
        <div id="layer-container"></div>
      </div>
    </div>
  </main>

  <input id="image-input" type="file" accept="image/png image/jpeg">
  <img id="color-wheel-image" src="./img/color-wheel.png">

  <script type="module" src="/src/script.ts"></script>
</body>
</html>
